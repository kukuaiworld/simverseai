version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: simverse_db
    environment:
      POSTGRES_DB: simverse
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret_db_password_123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d simverse"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: simverse_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://admin:secret_db_password_123@db:5432/simverse
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CLERK_JWKS_URL=${CLERK_JWKS_URL}
    depends_on:
      db:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simverse_frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: always

volumes:
  pgdata:
